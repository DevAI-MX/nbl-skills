<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{FUENTES_URL}}" rel="stylesheet">
<style>
/*==BASE==*/
/*==MARCA==*/
.slide{background:var(--fondo);color:var(--texto);}
.slide.claro{background:var(--claro);color:var(--tinta);}
.slide.fondo-2{background:var(--fondo-2);}
.num-fondo{position:absolute;right:40px;bottom:-60px;font-family:var(--fuente-titulo);font-weight:900;font-size:560px;line-height:1;opacity:0.06;}
.centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;position:relative;}
.titulo{font-family:var(--fuente-titulo);font-weight:800;font-size:80px;line-height:1.04;letter-spacing:-0.025em;}
.texto{font-size:38px;line-height:1.45;opacity:0.85;}
.texto b{color:var(--acento);font-weight:700;opacity:1;}
.pie{position:relative;}
</style>
</head>
<body>
<!-- Clase del slide: "slide" (oscuro), "slide fondo-2" o "slide claro". Alterna entre slides.
     Bloque opcional NUMERO: el número del punto de una lista (1, 2, 3), nunca el número de la lámina. Mejor un ícono. -->
<div class="slide">
  <!--?NUMERO--><div class="num-fondo">{{NUM}}</div><!--/?NUMERO-->
  <div class="centro">
    <h2 class="titulo">{{TITULO}}</h2>
    <p class="texto">{{TEXTO}}</p>
  </div>
  <div class="pie"><span class="handle">{{HANDLE}}</span><span></span></div>
</div>
</body>
</html>
