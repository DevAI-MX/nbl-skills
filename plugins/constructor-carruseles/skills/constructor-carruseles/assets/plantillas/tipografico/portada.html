<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{FUENTES_URL}}" rel="stylesheet">
<style>
/*==BASE==*/
/*==MARCA==*/
.slide{background:var(--acento);color:var(--sobre-acento);}
.centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;}
.gancho{font-family:var(--fuente-titulo);font-weight:900;font-size:118px;line-height:0.98;letter-spacing:-0.035em;}
.gancho .serif{font-size:1.08em;}
.sub{font-size:36px;line-height:1.4;opacity:0.9;max-width:820px;}
</style>
</head>
<body>
<div class="slide">
  <div class="centro">
    <h1 class="gancho">{{GANCHO}}</h1>
    <p class="sub">{{SUBTITULO}}</p>
  </div>
  <div class="pie"><span class="handle">{{HANDLE}}</span><span></span></div>
</div>
</body>
</html>
