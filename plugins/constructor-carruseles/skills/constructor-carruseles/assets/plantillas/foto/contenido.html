<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{FUENTES_URL}}" rel="stylesheet">
<style>
/*==BASE==*/
/*==MARCA==*/
.slide{padding:0;color:#FFFFFF;}
.slide > .foto{position:absolute;inset:0;}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,0.72) 62%,rgba(0,0,0,0.95) 100%);}
.velo.denso{background:linear-gradient(180deg,rgba(0,0,0,0.25) 0%,rgba(0,0,0,0.55) 40%,rgba(0,0,0,0.92) 100%);}
.capa{position:absolute;inset:0;padding:var(--margen);display:flex;flex-direction:column;justify-content:flex-end;gap:36px;}
.gancho{font-family:var(--fuente-titulo);font-weight:900;font-size:104px;line-height:1.0;letter-spacing:-0.03em;}
.titulo{font-family:var(--fuente-titulo);font-weight:800;font-size:72px;line-height:1.06;letter-spacing:-0.02em;}
.gancho .acento-txt,.titulo .acento-txt{color:var(--acento);}
.texto{font-size:36px;line-height:1.45;opacity:0.9;}
.pie{margin-top:12px;}
.caja{background:var(--acento);color:var(--sobre-acento);border-radius:24px;padding:36px 44px;}
.caja small{display:block;font-weight:700;font-size:28px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.85;}
.caja b{display:block;font-family:var(--fuente-titulo);font-weight:900;font-size:130px;line-height:1;margin-top:6px;}
</style>
</head>
<body>
<div class="slide">
  <div class="foto" style="background-image:url('{{IMAGEN}}')"></div>
  <div class="velo denso"></div>
  <div class="capa">
    <h2 class="titulo">{{TITULO}}</h2>
    <p class="texto">{{TEXTO}}</p>
    <div class="pie"><span class="handle">{{HANDLE}}</span><span></span></div>
  </div>
</div>
</body>
</html>
